name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: btq_swap_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/btq_swap_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: htlc — typecheck, build, unit tests
        run: |
          npm run build -w packages/htlc
          node packages/htlc/scripts/bundle.mjs
          npm run test:coverage -w packages/htlc
      - name: backend — typecheck + unit tests
        run: |
          npm run typecheck -w packages/backend
          npm run test:coverage -w packages/backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typescript-coverage
          path: packages/*/coverage/
      - name: frontend — typecheck + build
        run: npm run build -w packages/frontend
      - name: browser — reopen and recover existing swaps
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser -w packages/frontend
      - name: contracts — HtlcERC20 tests
        run: npm test -w packages/contracts
      - name: contracts — committed backend artifacts match the sources
        run: |
          node packages/contracts/scripts/export-artifacts.mjs
          git diff --exit-code -- packages/backend/src/chains/artifacts

  solana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/solana-htlc
      - name: Solana program — runtime settlement tests
        env:
          RUST_LOG: error
        run: cargo test --locked --manifest-path packages/solana-htlc/Cargo.toml

  docker:
    runs-on: ubuntu-latest
    needs: [test, solana]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f packages/backend/Dockerfile -t btq-swap-backend:ci .
      - run: docker build -f packages/frontend/Dockerfile -t btq-swap-web:ci .
