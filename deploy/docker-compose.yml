# BTQ Swap devnet stack (VPS): BTQ regtest + anvil + Postgres + API/workers + Discord bot + monitor.
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
name: btq-swap

x-backend: &backend
  image: btq-swap-backend:${IMAGE_TAG:-latest}
  env_file: ["${ENV_FILE:-.env}"]
  environment:
    DATABASE_URL: postgres://btqswap:${POSTGRES_PASSWORD}@postgres:5432/btqswap
    BTQ_RPC_URL: http://btqd:18443
    EVM_RPC_URL: http://anvil:8545
    PORT: "3001"
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: btqswap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: btqswap
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btqswap -d btqswap"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  btqd:
    image: btq-swap-btqd:${IMAGE_TAG:-latest}
    command:
      - -regtest
      - -server
      - -txindex
      - -listen=0
      - -fallbackfee=0.0002
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcport=18443
      - -rpcuser=${BTQ_RPC_USER}
      - -rpcpassword=${BTQ_RPC_PASS}
      - -rpcworkqueue=64
    volumes: [btqdata:/data]
    ports: ["127.0.0.1:${BTQ_RPC_HOST_PORT:-18443}:18443"]
    healthcheck:
      test: ["CMD-SHELL", "btq-cli -regtest -datadir=/data -rpcport=18443 -rpcuser=${BTQ_RPC_USER} -rpcpassword=${BTQ_RPC_PASS} getblockcount"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    user: root
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "2", "--state", "/data/anvil-state.json", "--state-interval", "10"]
    volumes: [anvildata:/data]
    ports: ["127.0.0.1:${ANVIL_HOST_PORT:-8545}:8545"]
    restart: unless-stopped

  bootstrap:
    <<: *backend
    command: ["bootstrap"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
      btqd: { condition: service_healthy }
      anvil: { condition: service_started }

  api:
    <<: *backend
    command: ["api"]
    depends_on:
      postgres: { condition: service_healthy }
      btqd: { condition: service_healthy }
      anvil: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  miner:
    <<: *backend
    command: ["miner"]
    depends_on:
      btqd: { condition: service_healthy }

  bot:
    <<: *backend
    command: ["bot"]
    depends_on:
      api: { condition: service_healthy }

  web:
    image: btq-swap-web:${IMAGE_TAG:-latest}
    ports: ["${WEB_PORT:-5173}:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # Run on demand:  docker compose -f deploy/docker-compose.yml --env-file deploy/.env run --rm sim --scenario all --mirror-discord
  sim:
    <<: *backend
    profiles: ["sim"]
    entrypoint: ["btq-swap", "sim"]
    environment:
      DATABASE_URL: postgres://btqswap:${POSTGRES_PASSWORD}@postgres:5432/btqswap
      BTQ_RPC_URL: http://btqd:18443
      EVM_RPC_URL: http://anvil:8545
      PORT: "3001"
      SIM_API_URL: http://api:3001/api
      SIM_REPORT_DIR: /app/packages/backend/sim-reports
    volumes: [simreports:/app/packages/backend/sim-reports]
    restart: "no"

volumes:
  pgdata:
  btqdata:
  anvildata:
  simreports:
