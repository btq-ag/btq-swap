[package]
name = "btq-sol-htlc"
version = "0.1.0"
edition = "2021"
description = "SPL-token HTLC used as the Solana rail of a BTQ atomic swap"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "=2.1.0"
spl-token = { version = "=7.0.0", features = ["no-entrypoint"] }

[dev-dependencies]
solana-program-test = "=2.1.0"
solana-sdk = "=2.1.0"
tokio = { version = "1", features = ["macros"] }

[profile.dev]
debug = 0
